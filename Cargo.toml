[package]
name = "dgmon"
version = "0.1.1"
edition = "2024"
description = "A lightweight system monitor for NVIDIA DGX Spark GPU clusters"
license = "Apache-2.0"
repository = "https://github.com/santanusinha/dgmon"
readme = "README.md"

[dependencies]
actix-web = "4"
actix-rt = "2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tsink = "0.10.2"
actix-cors = "0.7"
tokio = { version = "1", features = ["signal", "sync", "macros", "rt-multi-thread", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bollard = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
