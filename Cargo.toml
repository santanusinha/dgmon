[package]
name = "dgmon"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-rt = "2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
ureq = { version = "3", features = ["json"] }
toml = "0.8"
tsink = "0.10.2"
actix-cors = "0.7"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
